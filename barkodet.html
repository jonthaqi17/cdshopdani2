<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gjeneratori i Barkodeve</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
body { background:#f1f5f9; font-family: 'Segoe UI', sans-serif; padding:20px; }
.card { border-radius:12px; border:none; box-shadow:0 2px 10px rgba(0,0,0,.06); }

/* Pamja në ekran (jo për print) */
.barcode-item { 
  text-align:center; 
  padding:10px; 
  border:1px dashed #cbd5e1; 
  border-radius:8px; 
  background:#fff; 
  margin-bottom:12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.barcode-item .emri { font-size:13px; font-weight:600; margin-bottom:4px; }
.barcode-item .cmimi { font-size:12px; color:#059669; font-weight:600; margin-top:4px; }

.barcode-grid {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap:12px;
}
/* Stili per inputin e kopjeve */
.copies-input {
  width: 60px;
  text-align: center;
  font-weight: bold;
}
</style>
</head>
<body>

<!-- SEKSIONI I KONTROLLIT (FSHIHET GJATË PRINTIMIT) -->
<div class="no-print" id="uiArea">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h3 class="mb-0">🏷️ Gjeneratori i Barkodeve</h3>
    <div>
      <button class="btn btn-outline-secondary" onclick="window.location.href='./'">
        <i class="bi bi-arrow-left"></i> Kthehu
      </button>
      <button class="btn btn-warning" onclick="printRaportDitor()">
        <i class="bi bi-file-earmark-text"></i> Printo Raportin Ditor
      </button>
      <button class="btn btn-primary" onclick="printBarcodes()">
        <i class="bi bi-printer"></i> Printo
      </button>
    </div>
  </div>

  <div class="card p-3 mb-3">
    <div class="row g-3 align-items-end">
      <div class="col-md-3">
        <label class="form-label">Kërko produkt</label>
        <input id="searchInput" class="form-control" placeholder="Emri ose barkodi..." oninput="loadProduktet()">
      </div>
      <div class="col-md-2">
        <label class="form-label">Kategoria</label>
        <select id="katSelect" class="form-select" onchange="loadProduktet()">
          <option value="">Të gjitha</option>
          <option>CD</option>
          <option>USB</option>
          <option>SD Card</option>
          <option>Zmadhues Zëri</option>
          <option>Aksesor</option>
          <option>Adapter</option>
          <option>Kabllo Telefoni</option>
          <option>Çanta</option>
          <option>Tjetër</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Madhësia</label>
        <select id="sizeSelect" class="form-select" onchange="renderBarkodet()">
          <option value="small">E vogël</option>
          <option value="medium" selected>Mesatare</option>
          <option value="large">E madhe</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Shfaq</label>
        <select id="showSelect" class="form-select" onchange="renderBarkodet()">
          <option value="both">Barkod + Emër + Çmim</option>
          <option value="barcode">Vetëm Barkod</option>
          <option value="name">Barkod + Emër</option>
        </select>
      </div>
      <div class="col-md-3">
        <button class="btn btn-success w-100" onclick="zgjidhTëgjitha()">
          <i class="bi bi-check-all"></i> Zgjidh / Hiq të gjitha
        </button>
      </div>
    </div>
  </div>

  <div class="card p-3 mb-3">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div><span id="infoText" class="text-muted">Duke u ngarkuar...</span></div>
      <div><span class="badge bg-primary" id="selectedCount">0 të zgjedhur</span></div>
    </div>
  </div>

  <div class="card p-3 mb-3" style="max-height:400px; overflow-y:auto;">
    <h6 class="mb-3">📦 Zgjidh produktet dhe vendos sasinë:</h6>
    <div id="prodList"></div>
  </div>
</div>

<!-- SEKSIONI I BARKODEVE (SHFAQET NË EKRAN DHE PRINTIM) -->
<div id="barkodArea">
  <div class="barcode-grid" id="barcodeGrid"></div>
</div>

<script>
const SUPABASE_URL = 'https://rhkaqtpfhcyajyslnvln.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJoa2FxdHBmaGN5YWp5c2xudmxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3Mzc1OTQsImV4cCI6MjA5MDMxMzU5NH0.oaObjuascv482VGXD7p-loOZY048mt1LbwJlWcZyCSE';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let PRODUKTET = [];
let SELECTED = new Set();
let COPIES = {}; // Objekt që mban sasinë për çdo produkt (id -> numri)

async function checkAuth() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) {
    alert('Duhet të hysh si admin!');
    window.location.href = './';
    return false;
  }
  const { data: prof } = await db.from('profiles').select('*').eq('id', user.id).single();
  if (!prof || prof.roli !== 'admin') {
    alert('Vetëm admini ka qasje!');
    window.location.href = './';
    return false;
  }
  return true;
}

async function loadProduktet() {
  const q = document.getElementById('searchInput').value.trim();
  const kat = document.getElementById('katSelect').value;
  let query = db.from('produktet').select('*').order('emri');
  if (q) query = query.or('emri.ilike.%' + q + '%,barkodi.ilike.%' + q + '%');
  if (kat) query = query.eq('kategoria', kat);
  const { data, error } = await query;
  if (error) { 
    document.getElementById('prodList').innerHTML = '<div class="alert alert-danger">' + error.message + '</div>';
    return;
  }
  PRODUKTET = data || [];
  renderLista();
  renderBarkodet();
}

function renderLista() {
  const list = document.getElementById('prodList');
  if (!PRODUKTET.length) {
    list.innerHTML = '<p class="text-muted">Nuk ka produkte.</p>';
    document.getElementById('infoText').textContent = '0 produkte';
    return;
  }
  document.getElementById('infoText').textContent = PRODUKTET.length + ' produkte të gjetura';
  
  list.innerHTML = PRODUKTET.map(p => {
    const checked = SELECTED.has(p.id) ? 'checked' : '';
    // Marrim sasine, nese s'eshte caktuar default eshte 1
    const sasia = COPIES[p.id] || 1; 
    
    return '<div class="d-flex align-items-center mb-2 p-2 border rounded flex-wrap gap-2">' +
      '<div class="form-check m-0 flex-grow-1">' +
        '<input class="form-check-input" type="checkbox" id="chk_' + p.id + '" ' + checked + 
        ' onchange="toggleSelect(' + p.id + ')">' +
        '<label class="form-check-label w-100" for="chk_' + p.id + '" style="cursor:pointer">' +
        '<b>' + p.emri + '</b> ' +
        '<small class="text-muted">• <code>' + p.barkodi + '</code>' +
        (p.kategoria ? ' • ' + p.kategoria : '') +
        ' • ' + Number(p.cmimi_shitjes).toFixed(2) + ' €' +
        ' • Stok: ' + p.sasia + '</small>' +
        '</label>' +
      '</div>' +
      '<div class="d-flex align-items-center gap-1">' +
        '<small class="text-muted">Kopje:</small>' +
        '<input type="number" class="form-control form-control-sm copies-input" min="1" max="50" value="' + sasia + '" ' +
        'onchange="updateCopies(' + p.id + ', this.value)" onclick="event.stopPropagation()">' +
      '</div>' +
      '</div>';
  }).join('');
  
  updateCount();
}

function toggleSelect(id) {
  if (SELECTED.has(id)) SELECTED.delete(id);
  else SELECTED.add(id);
  updateCount();
  renderBarkodet();
}

function updateCopies(id, val) {
  let num = parseInt(val);
  if (isNaN(num) || num < 1) num = 1;
  if (num > 50) num = 50; // Kufizim maksimal per siguri
  COPIES[id] = num;
  
  // Nese e ndryshon sasine, e zgjedhim automatikisht produktin
  if (!SELECTED.has(id)) {
    SELECTED.add(id);
    document.getElementById('chk_' + id).checked = true;
    updateCount();
  }
  
  renderBarkodet();
}

function zgjidhTëgjitha() {
  if (SELECTED.size === PRODUKTET.length) {
    SELECTED.clear();
  } else {
    PRODUKTET.forEach(p => SELECTED.add(p.id));
  }
  renderLista();
  renderBarkodet();
}

function updateCount() {
  document.getElementById('selectedCount').textContent = SELECTED.size + ' të zgjedhur';
}

function renderBarkodet() {
  const grid = document.getElementById('barcodeGrid');
  const size = document.getElementById('sizeSelect').value;
  const show = document.getElementById('showSelect').value;
  
  const sizeMap = {
    small:  { width: 1, height: 25, fontSize: 9, displayValue: true },
    medium: { width: 1.2, height: 35, fontSize: 10, displayValue: true },
    large:  { width: 1.5, height: 45, fontSize: 12, displayValue: true }
  };
  const cfg = sizeMap[size];
  
  // Krijojme nje liste me te gjitha barkodet e zgjedhura (duke shtuar kopjet)
  let allBarcodesToPrint = [];
  PRODUKTET.filter(p => SELECTED.has(p.id)).forEach(p => {
    let sasia = COPIES[p.id] || 1;
    for(let i = 0; i < sasia; i++) {
      allBarcodesToPrint.push(p);
    }
  });

  if (!allBarcodesToPrint.length) {
    grid.innerHTML = '<p class="text-muted text-center p-4">Zgjidh produkte për të gjeneruar barkodet.</p>';
    return;
  }
  
  grid.innerHTML = allBarcodesToPrint.map(p => 
    '<div class="barcode-item">' +
    (show !== 'barcode' ? '<div class="emri">' + p.emri + '</div>' : '') +
    '<svg class="barcode" data-barkod="' + p.barkodi + '"></svg>' +
    (show === 'both' ? '<div class="cmimi">' + Number(p.cmimi_shitjes).toFixed(2) + ' €</div>' : '') +
    '</div>'
  ).join('');
  
  document.querySelectorAll('.barcode').forEach(svg => {
    try {
      JsBarcode(svg, svg.getAttribute('data-barkod'), {
        format: 'CODE128',
        width: cfg.width,
        height: cfg.height,
        fontSize: cfg.fontSize,
        displayValue: cfg.displayValue,
        margin: 0,
        lineColor: '#000',
        background: '#fff'
      });
    } catch (e) {
      console.error('Gabim barkod:', e, svg.getAttribute('data-barkod'));
    }
  });
}

// FUNKSIONI KRYESOR PËR PRINTIM (Krijon nje Iframe te pavarur)
async function printBarcodes() {
  // Krijojme nje liste me te gjitha barkodet e zgjedhura
  let allBarcodesToPrint = [];
  PRODUKTET.filter(p => SELECTED.has(p.id)).forEach(p => {
    let sasia = COPIES[p.id] || 1;
    for(let i = 0; i < sasia; i++) {
      allBarcodesToPrint.push(p);
    }
  });

  if (!allBarcodesToPrint.length) {
    alert('Zgjidh së paku një produkt për të printuar!');
    return;
  }

  const size = document.getElementById('sizeSelect').value;
  const show = document.getElementById('showSelect').value;
  
  // Keto permasa jane optimizuar per etiketa 30x25mm
  const sizeMap = {
    small:  { width: 0.9, height: 22, fontSize: 8 },
    medium: { width: 1.2, height: 35, fontSize: 10 },
    large:  { width: 1.5, height: 45, fontSize: 12 }
  };
  const cfg = sizeMap[size];

  let html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Print Barcodes</title>';
  html += '<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"><\/script>';
  html += '<style>';
  // CSS per etiketa 30x25mm
  html += '@page { size: 30mm 25mm; margin: 0; }';
  html += 'html, body { margin:0; padding:0; width:30mm; height:25mm; background:#fff; font-family: Arial, sans-serif; }';
  html += '.label { width:30mm; height:25mm; display:flex; flex-direction:column; align-items:center; justify-content:center; page-break-after:always; box-sizing:border-box; padding:1mm; overflow:hidden; margin:0; }';
  html += '.emri { font-size: 9px; font-weight:bold; line-height:1; text-align:center; margin-bottom:1px; max-width:28mm; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }';
  html += '.cmimi { font-size: 9px; font-weight:bold; color:#000; margin-top:1px; }';
  html += 'svg { max-width:100%; height:auto; display:block; }';
  html += '<\/style><\/head><body>';

  // Tani bejme loop mbi listen e re (ku jane edhe kopjet e shtuara)
  allBarcodesToPrint.forEach(p => {
    html += '<div class="label">';
    if (show !== 'barcode') html += '<div class="emri">' + p.emri + '</div>';
    html += '<svg class="barcode" data-barkod="' + p.barkodi + '"></svg>';
    if (show === 'both') html += '<div class="cmimi">' + Number(p.cmimi_shitjes).toFixed(2) + ' €</div>';
    html += '</div>';
  });

  // Shtojme skriptin qe vizaton barkodin dhe e shtyn printimin
  html += '<script>';
  html += 'window.onload = function() {';
  html += '  var svgs = document.querySelectorAll(".barcode");';
  html += '  svgs.forEach(function(svg) {';
  html += '    try {';
  html += '      JsBarcode(svg, svg.getAttribute("data-barkod"), {';
  html += '        format: "CODE128", width: ' + cfg.width + ', height: ' + cfg.height + ',';
  html += '        fontSize: ' + cfg.fontSize + ', displayValue: true, margin: 0';
  html += '      });';
  html += '    } catch(e) { console.error(e); }';
  html += '  });';
  html += '  setTimeout(function() { window.print(); window.close(); }, 700);'; // Prit 0.7 sekonda
  html += '};';
  html += '<\/script></body></html>';

  // Krijojme nje iframe te padukshem per printim
  const iframe = document.createElement('iframe');
  iframe.style.position = 'fixed';
  iframe.style.right = '0';
  iframe.style.bottom = '0';
  iframe.style.width = '0';
  iframe.style.height = '0';
  iframe.style.border = '0';
  document.body.appendChild(iframe);
  iframe.srcdoc = html;
}

// ============================================================
// PRINTIMI I RAPORTIT DITOR NË A4
// ============================================================
async function printRaportDitor() {
  // 1. Merr datën e sotme (ose lejo përdoruesin të zgjedhë)
  const dataZgjedhur = prompt(
    'Data e raportit (YYYY-MM-DD):',
    new Date().toISOString().slice(0, 10)
  );
  if (!dataZgjedhur) return;

  const fillimi = dataZgjedhur + 'T00:00:00';
  const fundi   = dataZgjedhur + 'T23:59:59';

  // 2. Merr shitjet e ditës
  const { data: shitjet, error: errS } = await db
    .from('shitjet')
    .select('*')
    .gte('data_shitjes', fillimi)
    .lte('data_shitjes', fundi)
    .order('data_shitjes');

  if (errS) {
    alert('Gabim te shitjet: ' + errS.message);
    return;
  }

  if (!shitjet || !shitjet.length) {
    alert('Nuk ka shitje për datën ' + dataZgjedhur);
    return;
  }

  const shitjeIds = shitjet.map(s => s.id);

  // 3. Merr detajet e shitjeve
  const { data: detajet, error: errD } = await db
    .from('shitjet_detaje')
    .select('*')
    .in('shitje_id', shitjeIds);

  if (errD) {
    alert('Gabim te detajet: ' + errD.message);
    return;
  }

  // 4. Merr produktet për emrat
  const { data: produktet } = await db.from('produktet').select('id, emri, barkodi');
  const mapProdukte = {};
  (produktet || []).forEach(p => { mapProdukte[p.id] = p; });

  // 5. Merr profilet për emrat e punëtorëve
  const { data: profilet } = await db.from('profiles').select('id, emri, mbiemri, username');
  const mapProfiles = {};
  (profilet || []).forEach(p => { mapProfiles[p.id] = p; });

  // 6. Ndërto strukturat e raportit
  const totalShitje = shitjet.reduce((s, x) => s + Number(x.total || 0), 0);
  const totalArtikuj = shitjet.reduce((s, x) => s + Number(x.sasia_total || 0), 0);

  // Grupim sipas punëtorit
  const sipasPuntorit = {};
  shitjet.forEach(s => {
    const pid = s.user_id || s.punetori_id || 'panjohur';
    if (!sipasPuntorit[pid]) {
      sipasPuntorit[pid] = { shitje: 0, total: 0, artikuj: 0 };
    }
    sipasPuntorit[pid].shitje += 1;
    sipasPuntorit[pid].total += Number(s.total || 0);
    sipasPuntorit[pid].artikuj += Number(s.sasia_total || 0);
  });

  // 7. Ndërto HTML-in e raportit A4
  let html = '<!DOCTYPE html><html><head><meta charset="UTF-8">';
  html += '<title>Raport Ditor ' + dataZgjedhur + '</title>';
  html += '<style>';
  html += '@page { size: A4; margin: 12mm; }';
  html += 'body { font-family: Arial, sans-serif; font-size: 11px; color:#000; margin:0; padding:0; }';
  html += 'h1 { font-size: 20px; text-align:center; margin:0 0 4px; }';
  html += 'h2 { font-size: 14px; margin: 14px 0 6px; border-bottom: 2px solid #333; padding-bottom:3px; }';
  html += '.subtitle { text-align:center; color:#555; font-size:12px; margin-bottom:14px; }';
  html += 'table { width:100%; border-collapse: collapse; margin-bottom:10px; }';
  html += 'th, td { border:1px solid #999; padding:4px 6px; text-align:left; font-size:10.5px; }';
  html += 'th { background:#e5e7eb; font-weight:bold; }';
  html += 'td.num, th.num { text-align:right; }';
  html += '.total-row td { font-weight:bold; background:#f3f4f6; }';
  html += '.summary-box { display:flex; gap:10px; margin-bottom:14px; }';
  html += '.summary-box > div { flex:1; border:1px solid #999; padding:8px; text-align:center; }';
  html += '.summary-box .lbl { font-size:10px; color:#555; }';
  html += '.summary-box .val { font-size:16px; font-weight:bold; }';
  html += '.footer { margin-top:20px; text-align:center; font-size:9px; color:#777; border-top:1px solid #ccc; padding-top:6px; }';
  html += '</style></head><body>';

  // Header
  html += '<h1>RAPORT DITOR I SHITJEVE</h1>';
  html += '<div class="subtitle">Data: <b>' + dataZgjedhur + '</b> &nbsp;•&nbsp; Printuar: ' + new Date().toLocaleString('sq-AL') + '</div>';

  // Përmbledhje
  html += '<div class="summary-box">';
  html += '<div><div class="lbl">Total Shitje</div><div class="val">' + totalShitje.toFixed(2) + ' €</div></div>';
  html += '<div><div class="lbl">Nr. Transaksioneve</div><div class="val">' + shitjet.length + '</div></div>';
  html += '<div><div class="lbl">Nr. Artikujve</div><div class="val">' + totalArtikuj + '</div></div>';
  html += '</div>';

  // Raporti sipas punëtorit
  html += '<h2>📊 Përmbledhje sipas Punëtorit</h2>';
  html += '<table><thead><tr>';
  html += '<th>Punëtori</th><th class="num">Nr. Shitjeve</th><th class="num">Nr. Artikujve</th><th class="num">Totali (€)</th>';
  html += '</tr></thead><tbody>';
  Object.entries(sipasPuntorit).forEach(([pid, v]) => {
    const prof = mapProfiles[pid];
    const emri = prof ? ((prof.emri || '') + ' ' + (prof.mbiemri || '')).trim() || prof.username : 'Panjohur';
    html += '<tr><td>' + emri + '</td><td class="num">' + v.shitje + '</td><td class="num">' + v.artikuj + '</td><td class="num">' + v.total.toFixed(2) + '</td></tr>';
  });
  html += '<tr class="total-row"><td>TOTAL</td><td class="num">' + shitjet.length + '</td><td class="num">' + totalArtikuj + '</td><td class="num">' + totalShitje.toFixed(2) + '</td></tr>';
  html += '</tbody></table>';

  // Detajet e shitjeve
  html += '<h2>🧾 Detajet e Shitjeve</h2>';
  html += '<table><thead><tr>';
  html += '<th>#</th><th>Ora</th><th>Punëtori</th><th>Produkti</th><th class="num">Sasia</th><th class="num">Çmimi (€)</th><th class="num">Nëntotali (€)</th>';
  html += '</tr></thead><tbody>';
  let idx = 1;
  shitjet.forEach(s => {
    const detajetES = (detajet || []).filter(d => d.shitje_id === s.id);
    const prof = mapProfiles[s.user_id || s.punetori_id];
    const emriP = prof ? ((prof.emri || '') + ' ' + (prof.mbiemri || '')).trim() || prof.username : 'Panjohur';
    const ora = s.data_shitjes ? new Date(s.data_shitjes).toLocaleTimeString('sq-AL', {hour:'2-digit', minute:'2-digit'}) : '-';
    if (!detajetES.length) {
      html += '<tr><td>' + idx++ + '</td><td>' + ora + '</td><td>' + emriP + '</td><td colspan="4" class="num">Total: ' + Number(s.total || 0).toFixed(2) + ' €</td></tr>';
    } else {
      detajetES.forEach((d, i) => {
        const prod = mapProdukte[d.produkt_id] || {};
        html += '<tr>';
        html += '<td>' + (i === 0 ? idx++ : '') + '</td>';
        html += '<td>' + (i === 0 ? ora : '') + '</td>';
        html += '<td>' + (i === 0 ? emriP : '') + '</td>';
        html += '<td>' + (prod.emri || 'Produkt #' + d.produkt_id) + '</td>';
        html += '<td class="num">' + (d.sasia || 0) + '</td>';
        html += '<td class="num">' + Number(d.cmimi || 0).toFixed(2) + '</td>';
        html += '<td class="num">' + Number(d.nentotali || (d.sasia * d.cmimi) || 0).toFixed(2) + '</td>';
        html += '</tr>';
      });
    }
  });
  html += '<tr class="total-row"><td colspan="6">TOTAL DITOR</td><td class="num">' + totalShitje.toFixed(2) + '</td></tr>';
  html += '</tbody></table>';

  // Footer
  html += '<div class="footer">Raport i gjeneruar automatikisht • Gjeneratori i Barkodeve</div>';
  html += '</body></html>';

  // 8. Printo në iframe
  const iframe = document.createElement('iframe');
  iframe.style.position = 'fixed';
  iframe.style.right = '0';
  iframe.style.bottom = '0';
  iframe.style.width = '0';
  iframe.style.height = '0';
  iframe.style.border = '0';
  document.body.appendChild(iframe);
  iframe.srcdoc = html;
  iframe.onload = () => {
    setTimeout(() => {
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
    }, 500);
  };
}

// Kontrollo nëse ka parametër ?print=ID ne URL
async function handlePrintParam() {
  const params = new URLSearchParams(window.location.search);
  const printId = params.get('print');
  if (printId) {
    const { data } = await db.from('produktet').select('*').eq('id', printId).single();
    if (data) {
      SELECTED.add(data.id);
      COPIES[data.id] = 1; // Default 1 here
      PRODUKTET = [data];
      renderLista();
      renderBarkodet();
      // Presim pak derisa faqja te jete gati dhe e nisim printimin automatik
      setTimeout(() => printBarcodes(), 1000);
    }
  }
}

window.addEventListener('load', async () => {
  const ok = await checkAuth();
  if (!ok) return;
  await loadProduktet();
  await handlePrintParam();
});
</script>
