<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gjeneratori i Barkodeve 30x25mm</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
body { background:#f1f5f9; font-family: 'Segoe UI', sans-serif; padding:20px; }
.card { border-radius:12px; border:none; box-shadow:0 2px 10px rgba(0,0,0,.06); }

/* ===== ETIKETA 30x25 mm ===== */
.etiketë {
  width: 30mm;
  height: 25mm;
  padding: 1mm;
  background: #fff;
  border: 1px solid #cbd5e1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  page-break-inside: avoid;
  box-sizing: border-box;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.etiketë .emri {
  font-size: 7pt;
  font-weight: bold;
  text-align: center;
  width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 1.1;
  color: #000;
}

.etiketë .barkod-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  overflow: hidden;
}

.etiketë svg {
  max-width: 100%;
  max-height: 100%;
  display: block;
}

.etiketë .info {
  font-size: 6pt;
  text-align: center;
  width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 1;
  color: #000;
}

.etiketë .cmimi {
  font-weight: bold;
  color: #059669;
}

/* Layout i etiketave në ekran */
.etiketat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, 30mm);
  gap: 3mm;
  justify-content: center;
  padding: 10mm;
  background: #fff;
  border-radius: 12px;
}

/* ===== PRINT ===== */
@media print {
  body { background: #fff !important; padding: 0 !important; margin: 0 !important; }
  .no-print { display: none !important; }
  
  .etiketat-grid {
    display: grid !important;
    grid-template-columns: repeat(6, 30mm) !important;  /* 6 kolona në A4 = 180mm */
    gap: 0 !important;
    padding: 0 !important;
    background: none !important;
    border-radius: 0 !important;
  }
  
  .etiketë {
    border: 1px dashed #ddd !important;
    margin: 0 !important;
    box-shadow: none !important;
  }
  
  @page { 
    size: A4; 
    margin: 5mm; 
  }
}

/* Kontrollet */
.kontroll-panel {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
}
</style>
</head>
<body>

<div class="no-print">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h3 class="mb-0">🏷️ Barkode 30×25mm</h3>
    <div>
      <button class="btn btn-outline-secondary" onclick="window.location.href='./'">
        <i class="bi bi-arrow-left"></i> Kthehu
      </button>
      <button class="btn btn-primary" onclick="window.print()">
        <i class="bi bi-printer"></i> Printo
      </button>
    </div>
  </div>

  <div class="kontroll-panel">
    <div class="row g-3 align-items-end">
      <div class="col-md-3">
        <label class="form-label">Kërko produkt</label>
        <input id="searchInput" class="form-control" placeholder="Emri ose barkodi..." oninput="loadProduktet()">
      </div>
      <div class="col-md-2">
        <label class="form-label">Kategoria</label>
        <select id="katSelect" class="form-select" onchange="loadProduktet()">
          <option value="">Të gjitha</option>
          <option>CD</option>
          <option>USB</option>
          <option>SD Card</option>
          <option>Zmadhues Zëri</option>
          <option>Aksesor</option>
          <option>Adapter</option>
          <option>Kabllo Telefoni</option>
          <option>Çanta</option>
          <option>Tjetër</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Lloji i etiketës</label>
        <select id="labelSelect" class="form-select" onchange="renderBarkodet()">
          <option value="both" selected>Emër + Barkod + Çmim</option>
          <option value="name">Emër + Barkod</option>
          <option value="barcode">Vetëm Barkod</option>
          <option value="price">Barkod + Çmim</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Kopje për secilin</label>
        <input id="copiesInput" type="number" class="form-control" value="1" min="1" max="20" onchange="renderBarkodet()">
      </div>
      <div class="col-md-3">
        <button class="btn btn-success w-100" onclick="zgjidhTëgjitha()">
          <i class="bi bi-check-all"></i> Zgjidh / Hiq të gjitha
        </button>
      </div>
    </div>
  </div>

  <div class="kontroll-panel">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div><span id="infoText" class="text-muted">Duke u ngarkuar...</span></div>
      <div><span class="badge bg-primary" id="selectedCount">0 të zgjedhur</span></div>
    </div>
  </div>

  <div class="kontroll-panel" style="max-height:400px; overflow-y:auto;">
    <h6 class="mb-3">📦 Zgjidh produktet:</h6>
    <div id="prodList"></div>
  </div>
</div>

<div class="etiketat-grid" id="etiketatGrid"></div>

<script>
const SUPABASE_URL = 'https://rhkaqtpfhcyajyslnvln.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJoa2FxdHBmaGN5YWp5c2xudmxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3Mzc1OTQsImV4cCI6MjA5MDMxMzU5NH0.oaObjuascv482VGXD7p-loOZY048mt1LbwJlWcZyCSE';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let PRODUKTET = [];
let SELECTED = new Set();

// =====================================================
// AUTH CHECK
// =====================================================
async function checkAuth() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) {
    alert('Duhet të hysh si admin!');
    window.location.href = './';
    return false;
  }
  const { data: prof } = await db.from('profiles').select('*').eq('id', user.id).single();
  if (!prof || prof.roli !== 'admin') {
    alert('Vetëm admini ka qasje!');
    window.location.href = './';
    return false;
  }
  return true;
}

// =====================================================
// NGARKO PRODUKTET
// =====================================================
async function loadProduktet() {
  const q = document.getElementById('searchInput').value.trim();
  const kat = document.getElementById('katSelect').value;
  let query = db.from('produktet').select('*').order('emri');
  if (q) query = query.or('emri.ilike.%' + q + '%,barkodi.ilike.%' + q + '%');
  if (kat) query = query.eq('kategoria', kat);
  const { data, error } = await query;
  if (error) { 
    document.getElementById('prodList').innerHTML = '<div class="alert alert-danger">' + error.message + '</div>';
    return;
  }
  PRODUKTET = data || [];
  renderLista();
  renderBarkodet();
}

function renderLista() {
  const list = document.getElementById('prodList');
  if (!PRODUKTET.length) {
    list.innerHTML = '<p class="text-muted">Nuk ka produkte.</p>';
    document.getElementById('infoText').textContent = '0 produkte';
    return;
  }
  document.getElementById('infoText').textContent = PRODUKTET.length + ' produkte të gjetura';
  list.innerHTML = PRODUKTET.map(p => {
    const checked = SELECTED.has(p.id) ? 'checked' : '';
    return '<div class="form-check mb-2 p-2 border rounded">' +
      '<input class="form-check-input" type="checkbox" id="chk_' + p.id + '" ' + checked + 
      ' onchange="toggleSelect(' + p.id + ')">' +
      '<label class="form-check-label w-100" for="chk_' + p.id + '" style="cursor:pointer">' +
      '<b>' + p.emri + '</b> ' +
      '<small class="text-muted">• <code>' + p.barkodi + '</code>' +
      (p.kategoria ? ' • ' + p.kategoria : '') +
      ' • ' + Number(p.cmimi_shitjes).toFixed(2) + ' €' +
      ' • Stok: ' + p.sasia + '</small>' +
      '</label></div>';
  }).join('');
  updateCount();
}

function toggleSelect(id) {
  if (SELECTED.has(id)) SELECTED.delete(id);
  else SELECTED.add(id);
  updateCount();
  renderBarkodet();
}

function zgjidhTëgjitha() {
  if (SELECTED.size === PRODUKTET.length) {
    SELECTED.clear();
  } else {
    PRODUKTET.forEach(p => SELECTED.add(p.id));
  }
  renderLista();
  renderBarkodet();
}

function updateCount() {
  document.getElementById('selectedCount').textContent = SELECTED.size + ' të zgjedhur';
}

// =====================================================
// RENDER ETIKETAT 30x25mm
// =====================================================
function renderBarkodet() {
  const grid = document.getElementById('etiketatGrid');
  const mode = document.getElementById('labelSelect').value;
  const copies = parseInt(document.getElementById('copiesInput').value) || 1;
  const selected = PRODUKTET.filter(p => SELECTED.has(p.id));

  if (!selected.length) {
    grid.innerHTML = '<p class="text-muted text-center p-4" style="grid-column: 1/-1;">Zgjidh produkte për të gjeneruar etiketat.</p>';
    return;
  }

  // Ndërto listën e etiketave (me kopje)
  let etiketat = [];
  selected.forEach(p => {
    for (let i = 0; i < copies; i++) {
      etiketat.push(p);
    }
  });

  grid.innerHTML = etiketat.map(p => {
    let content = '';
    if (mode === 'both') {
      content = 
        '<div class="emri">' + p.emri + '</div>' +
        '<div class="barkod-wrap"><svg class="barcode" data-barkod="' + p.barkodi + '"></svg></div>' +
        '<div class="info">' + p.barkodi + ' • <span class="cmimi">' + Number(p.cmimi_shitjes).toFixed(2) + '€</span></div>';
    } else if (mode === 'name') {
      content = 
        '<div class="emri">' + p.emri + '</div>' +
        '<div class="barkod-wrap"><svg class="barcode" data-barkod="' + p.barkodi + '"></svg></div>' +
        '<div class="info">' + p.barkodi + '</div>';
    } else if (mode === 'price') {
      content = 
        '<div class="barkod-wrap"><svg class="barcode" data-barkod="' + p.barkodi + '"></svg></div>' +
        '<div class="info">' + p.barkodi + ' • <span class="cmimi">' + Number(p.cmimi_shitjes).toFixed(2) + '€</span></div>';
    } else {
      content = 
        '<div class="barkod-wrap"><svg class="barcode" data-barkod="' + p.barkodi + '"></svg></div>';
    }
    return '<div class="etiketë">' + content + '</div>';
  }).join('');

  // Gjenero barkodet SVG me dimensione të përshtatura për 30x25mm
  document.querySelectorAll('.barcode').forEach(svg => {
    try {
      JsBarcode(svg, svg.getAttribute('data-barkod'), {
        format: 'CODE128',
        width: 1.1,           // Vija më të holla për etiketë të vogël
        height: 35,           // Lartësia në px (~9mm)
        fontSize: 8,          // Font i vogël
        displayValue: false,  // Nuk shfaqim vlerën (e shfaqim veçmas)
        margin: 1,
        lineColor: '#000',
        background: '#fff'
      });
    } catch (e) {
      console.error('Gabim barkod:', e, svg.getAttribute('data-barkod'));
    }
  });
}

// =====================================================
// HANDLE ?print=ID (nga produkte)
// =====================================================
async function handlePrintParam() {
  const params = new URLSearchParams(window.location.search);
  const printId = params.get('print');
  if (printId) {
    const { data } = await db.from('produktet').select('*').eq('id', printId).single();
    if (data) {
      SELECTED.add(data.id);
      PRODUKTET = [data];
      renderLista();
      renderBarkodet();
      setTimeout(() => window.print(), 600);
    }
  }
}

// =====================================================
// INICIALIZIMI
// =====================================================
window.addEventListener('load', async () => {
  const ok = await checkAuth();
  if (!ok) return;
  await loadProduktet();
  await handlePrintParam();
});
</script>
</body>
</html>
