<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gjeneratori i Barkodeve</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
body { background:#f1f5f9; font-family: 'Segoe UI', sans-serif; padding:20px; }
.card { border-radius:12px; border:none; box-shadow:0 2px 10px rgba(0,0,0,.06); }

/* Pamja në ekran (jo për print) */
.barcode-item { 
  text-align:center; 
  padding:10px; 
  border:1px dashed #cbd5e1; 
  border-radius:8px; 
  background:#fff; 
  margin-bottom:12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.barcode-item .emri { font-size:13px; font-weight:600; margin-bottom:4px; }
.barcode-item .cmimi { font-size:12px; color:#059669; font-weight:600; margin-top:4px; }

.barcode-grid {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap:12px;
}
</style>
</head>
<body>

<!-- SEKSIONI I KONTROLLIT (FSHIHET GJATË PRINTIMIT) -->
<div class="no-print" id="uiArea">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h3 class="mb-0">🏷️ Gjeneratori i Barkodeve</h3>
    <div>
      <button class="btn btn-outline-secondary" onclick="window.location.href='./'">
        <i class="bi bi-arrow-left"></i> Kthehu
      </button>
      <button class="btn btn-primary" onclick="printBarcodes()">
        <i class="bi bi-printer"></i> Printo
      </button>
    </div>
  </div>

  <div class="card p-3 mb-3">
    <div class="row g-3 align-items-end">
      <div class="col-md-3">
        <label class="form-label">Kërko produkt</label>
        <input id="searchInput" class="form-control" placeholder="Emri ose barkodi..." oninput="loadProduktet()">
      </div>
      <div class="col-md-2">
        <label class="form-label">Kategoria</label>
        <select id="katSelect" class="form-select" onchange="loadProduktet()">
          <option value="">Të gjitha</option>
          <option>CD</option>
          <option>USB</option>
          <option>SD Card</option>
          <option>Zmadhues Zëri</option>
          <option>Aksesor</option>
          <option>Adapter</option>
          <option>Kabllo Telefoni</option>
          <option>Çanta</option>
          <option>Tjetër</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Madhësia</label>
        <select id="sizeSelect" class="form-select" onchange="renderBarkodet()">
          <option value="small">E vogël</option>
          <option value="medium" selected>Mesatare</option>
          <option value="large">E madhe</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Shfaq</label>
        <select id="showSelect" class="form-select" onchange="renderBarkodet()">
          <option value="both">Barkod + Emër + Çmim</option>
          <option value="barcode">Vetëm Barkod</option>
          <option value="name">Barkod + Emër</option>
        </select>
      </div>
      <div class="col-md-3">
        <button class="btn btn-success w-100" onclick="zgjidhTëgjitha()">
          <i class="bi bi-check-all"></i> Zgjidh / Hiq të gjitha
        </button>
      </div>
    </div>
  </div>

  <div class="card p-3 mb-3">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div><span id="infoText" class="text-muted">Duke u ngarkuar...</span></div>
      <div><span class="badge bg-primary" id="selectedCount">0 të zgjedhur</span></div>
    </div>
  </div>

  <div class="card p-3 mb-3" style="max-height:400px; overflow-y:auto;">
    <h6 class="mb-3">📦 Zgjidh produktet:</h6>
    <div id="prodList"></div>
  </div>
</div>

<!-- SEKSIONI I BARKODEVE (SHFAQET NË EKRAN DHE PRINTIM) -->
<div id="barkodArea">
  <div class="barcode-grid" id="barcodeGrid"></div>
</div>

<script>
const SUPABASE_URL = 'https://rhkaqtpfhcyajyslnvln.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJoa2FxdHBmaGN5YWp5c2xudmxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3Mzc1OTQsImV4cCI6MjA5MDMxMzU5NH0.oaObjuascv482VGXD7p-loOZY048mt1LbwJlWcZyCSE';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let PRODUKTET = [];
let SELECTED = new Set();

async function checkAuth() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) {
    alert('Duhet të hysh si admin!');
    window.location.href = './';
    return false;
  }
  const { data: prof } = await db.from('profiles').select('*').eq('id', user.id).single();
  if (!prof || prof.roli !== 'admin') {
    alert('Vetëm admini ka qasje!');
    window.location.href = './';
    return false;
  }
  return true;
}

async function loadProduktet() {
  const q = document.getElementById('searchInput').value.trim();
  const kat = document.getElementById('katSelect').value;
  let query = db.from('produktet').select('*').order('emri');
  if (q) query = query.or('emri.ilike.%' + q + '%,barkodi.ilike.%' + q + '%');
  if (kat) query = query.eq('kategoria', kat);
  const { data, error } = await query;
  if (error) { 
    document.getElementById('prodList').innerHTML = '<div class="alert alert-danger">' + error.message + '</div>';
    return;
  }
  PRODUKTET = data || [];
  renderLista();
  renderBarkodet();
}

function renderLista() {
  const list = document.getElementById('prodList');
  if (!PRODUKTET.length) {
    list.innerHTML = '<p class="text-muted">Nuk ka produkte.</p>';
    document.getElementById('infoText').textContent = '0 produkte';
    return;
  }
  document.getElementById('infoText').textContent = PRODUKTET.length + ' produkte të gjetura';
  list.innerHTML = PRODUKTET.map(p => {
    const checked = SELECTED.has(p.id) ? 'checked' : '';
    return '<div class="form-check mb-2 p-2 border rounded">' +
      '<input class="form-check-input" type="checkbox" id="chk_' + p.id + '" ' + checked + 
      ' onchange="toggleSelect(' + p.id + ')">' +
      '<label class="form-check-label w-100" for="chk_' + p.id + '" style="cursor:pointer">' +
      '<b>' + p.emri + '</b> ' +
      '<small class="text-muted">• <code>' + p.barkodi + '</code>' +
      (p.kategoria ? ' • ' + p.kategoria : '') +
      ' • ' + Number(p.cmimi_shitjes).toFixed(2) + ' €' +
      ' • Stok: ' + p.sasia + '</small>' +
      '</label></div>';
  }).join('');
  updateCount();
}

function toggleSelect(id) {
  if (SELECTED.has(id)) SELECTED.delete(id);
  else SELECTED.add(id);
  updateCount();
  renderBarkodet();
}

function zgjidhTëgjitha() {
  if (SELECTED.size === PRODUKTET.length) {
    SELECTED.clear();
  } else {
    PRODUKTET.forEach(p => SELECTED.add(p.id));
  }
  renderLista();
  renderBarkodet();
}

function updateCount() {
  document.getElementById('selectedCount').textContent = SELECTED.size + ' të zgjedhur';
}

function renderBarkodet() {
  const grid = document.getElementById('barcodeGrid');
  const size = document.getElementById('sizeSelect').value;
  const show = document.getElementById('showSelect').value;
  
  const sizeMap = {
    small:  { width: 1, height: 25, fontSize: 9, displayValue: true },
    medium: { width: 1.2, height: 35, fontSize: 10, displayValue: true },
    large:  { width: 1.5, height: 45, fontSize: 12, displayValue: true }
  };
  const cfg = sizeMap[size];
  const selected = PRODUKTET.filter(p => SELECTED.has(p.id));
  
  if (!selected.length) {
    grid.innerHTML = '<p class="text-muted text-center p-4">Zgjidh produkte për të gjeneruar barkodet.</p>';
    return;
  }
  
  grid.innerHTML = selected.map(p => 
    '<div class="barcode-item">' +
    (show !== 'barcode' ? '<div class="emri">' + p.emri + '</div>' : '') +
    '<svg class="barcode" data-barkod="' + p.barkodi + '"></svg>' +
    (show === 'both' ? '<div class="cmimi">' + Number(p.cmimi_shitjes).toFixed(2) + ' €</div>' : '') +
    '</div>'
  ).join('');
  
  document.querySelectorAll('.barcode').forEach(svg => {
    try {
      JsBarcode(svg, svg.getAttribute('data-barkod'), {
        format: 'CODE128',
        width: cfg.width,
        height: cfg.height,
        fontSize: cfg.fontSize,
        displayValue: cfg.displayValue,
        margin: 0,
        lineColor: '#000',
        background: '#fff'
      });
    } catch (e) {
      console.error('Gabim barkod:', e, svg.getAttribute('data-barkod'));
    }
  });
}

// FUNKSIONI KRYESOR PËR PRINTIM (Krijon nje Iframe te pavarur)
async function printBarcodes() {
  const selected = PRODUKTET.filter(p => SELECTED.has(p.id));
  if (!selected.length) {
    alert('Zgjidh së paku një produkt për të printuar!');
    return;
  }

  const size = document.getElementById('sizeSelect').value;
  const show = document.getElementById('showSelect').value;
  
  // Keto permasa jane optimizuar per etiketa 30x25mm
  const sizeMap = {
    small:  { width: 0.9, height: 22, fontSize: 8 },
    medium: { width: 1.2, height: 35, fontSize: 10 },
    large:  { width: 1.5, height: 45, fontSize: 12 }
  };
  const cfg = sizeMap[size];

  let html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Print Barcodes</title>';
  html += '<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"><\/script>';
  html += '<style>';
  // CSS per etiketa 30x25mm
  html += '@page { size: 30mm 25mm; margin: 0; }';
  html += 'html, body { margin:0; padding:0; width:30mm; height:25mm; background:#fff; font-family: Arial, sans-serif; }';
  html += '.label { width:30mm; height:25mm; display:flex; flex-direction:column; align-items:center; justify-content:center; page-break-after:always; box-sizing:border-box; padding:1mm; overflow:hidden; margin:0; }';
  html += '.emri { font-size: 9px; font-weight:bold; line-height:1; text-align:center; margin-bottom:1px; max-width:28mm; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }';
  html += '.cmimi { font-size: 9px; font-weight:bold; color:#000; margin-top:1px; }';
  html += 'svg { max-width:100%; height:auto; display:block; }';
  html += '<\/style><\/head><body>';

  selected.forEach(p => {
    html += '<div class="label">';
    if (show !== 'barcode') html += '<div class="emri">' + p.emri + '</div>';
    html += '<svg class="barcode" data-barkod="' + p.barkodi + '"></svg>';
    if (show === 'both') html += '<div class="cmimi">' + Number(p.cmimi_shitjes).toFixed(2) + ' €</div>';
    html += '</div>';
  });

  // Shtojme skriptin qe vizaton barkodin dhe e shtyn printimin
  html += '<script>';
  html += 'window.onload = function() {';
  html += '  var svgs = document.querySelectorAll(".barcode");';
  html += '  svgs.forEach(function(svg) {';
  html += '    try {';
  html += '      JsBarcode(svg, svg.getAttribute("data-barkod"), {';
  html += '        format: "CODE128", width: ' + cfg.width + ', height: ' + cfg.height + ',';
  html += '        fontSize: ' + cfg.fontSize + ', displayValue: true, margin: 0';
  html += '      });';
  html += '    } catch(e) { console.error(e); }';
  html += '  });';
  html += '  setTimeout(function() { window.print(); window.close(); }, 700);'; // Prit 0.7 sekonda
  html += '};';
  html += '<\/script></body></html>';

  // Krijojme nje iframe te padukshem per printim
  const iframe = document.createElement('iframe');
  iframe.style.position = 'fixed';
  iframe.style.right = '0';
  iframe.style.bottom = '0';
  iframe.style.width = '0';
  iframe.style.height = '0';
  iframe.style.border = '0';
  document.body.appendChild(iframe);
  iframe.srcdoc = html;
}

// Kontrollo nëse ka parametër ?print=ID ne URL
async function handlePrintParam() {
  const params = new URLSearchParams(window.location.search);
  const printId = params.get('print');
  if (printId) {
    const { data } = await db.from('produktet').select('*').eq('id', printId).single();
    if (data) {
      SELECTED.add(data.id);
      PRODUKTET = [data];
      renderLista();
      renderBarkodet();
      // Presim pak derisa faqja te jete gati dhe e nisim printimin automatik
      setTimeout(() => printBarcodes(), 1000);
    }
  }
}

window.addEventListener('load', async () => {
  const ok = await checkAuth();
  if (!ok) return;
  await loadProduktet();
  await handlePrintParam();
});
</script>
</body>
</html>
